<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat Pump Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ef;
    --surface: #fcfcfb;
    --border: #e3e1da;
    --grid: #ebe9e3;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #7d7c77;
    --series-1: #2a78d6; /* indoor */
    --series-2: #eb6834; /* outdoor */
    --setpoint: #52514e;
    --heat-band: rgba(235, 104, 52, 0.12);
    --offpeak-band: rgba(42, 120, 214, 0.07);
    --bar: #2a78d6;
    --bar-peak: #eb6834;
    --good: #0ca30c;
    --warn: #fab219;
    --critical: #d03b3b;
    --btn: #0b0b0b;
    --btn-text: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211;
      --surface: #1a1a19;
      --border: #2e2e2b;
      --grid: #262624;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --text-3: #8e8d86;
      --series-1: #3987e5;
      --series-2: #d95926;
      --setpoint: #c3c2b7;
      --heat-band: rgba(217, 89, 38, 0.16);
      --offpeak-band: rgba(57, 135, 229, 0.10);
      --bar: #3987e5;
      --bar-peak: #d95926;
      --btn: #f0efec;
      --btn-text: #1a1a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d86;
    --series-1: #3987e5; --series-2: #d95926; --setpoint: #c3c2b7;
    --heat-band: rgba(217, 89, 38, 0.16); --offpeak-band: rgba(57, 135, 229, 0.10);
    --bar: #3987e5; --bar-peak: #d95926; --btn: #f0efec; --btn-text: #1a1a19;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .muted { color: var(--text-3); font-size: 13px; }
  .spacer { flex: 1; }
  button, select {
    font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 6px 12px; cursor: pointer;
  }
  button.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { font-size: 13px; color: var(--text-2); }
  .tile .value { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .tile .sub { font-size: 13px; color: var(--text-3); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .plan { font-size: 17px; font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin: 0 0 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
  .key-dash { border-top-style: dashed; }
  .key-box { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    white-space: nowrap; display: none; z-index: 2;
  }
  .tip .t { color: var(--text-3); margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 8px; }
  .tip strong { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-2); font-weight: 600; font-size: 13px; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 8px; }
  .scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; }
  .err { color: var(--critical); font-size: 13px; }
  .return { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--grid); }
  .return label { font-size: 13px; color: var(--text-2); font-weight: 600; }
  input[type="datetime-local"] {
    font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 5px 8px; min-width: 0; max-width: 100%;
  }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  .totals div { font-size: 13px; color: var(--text-2); }
  .totals strong { display: block; font-size: 20px; color: var(--text); font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) { .tile .value { font-size: 26px; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
"use strict";
// Served by the Pi; the data comes from /thermostat/* on the same host. Open on
// the home network -- no token. Writes carry X-Requested-By, which the Pi
// requires so another site can't switch the heat through this browser.
const RANGE_KEY = "heatpump-dashboard-range";
const REFRESH_MS = 60 * 1000;
const app = document.getElementById("app");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
store.del("heatpump-dashboard-token"); // left over from when the page asked for one

let rangeHours = parseInt(store.get(RANGE_KEY) || "48", 10);
let status = null, history = null, lastError = null, timer = null;
let renderPending = false, returnDraft = null; // the return time being edited, if any

// --- tiny DOM helpers (all text via textContent) ---------------------------
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs = {}) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}
const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtDay = (d) => d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
const fmtWhen = (d) => `${fmtDay(d)} ${fmtTime(d)}`;
const deg = (v) => (v == null || !Number.isFinite(v) ? "–" : `${Math.round(v)}°`);

// --- data ------------------------------------------------------------------
async function api(path, opts = {}) {
  const write = opts.method && opts.method !== "GET";
  const res = await fetch(path, { ...opts, headers: { ...(write ? { "X-Requested-By": "dashboard" } : {}), ...(opts.headers || {}) } });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

async function load() {
  try {
    [status, history] = await Promise.all([api("/thermostat/status"), api(`/thermostat/history?hours=${rangeHours}`)]);
    lastError = null;
  } catch (err) {
    lastError = err.message;
  }
  // A refresh mid-edit would wipe the return time being picked; catch up on blur.
  if (document.activeElement?.id === "return-at") { renderPending = true; return; }
  render();
}

function schedule() {
  clearInterval(timer);
  timer = setInterval(load, REFRESH_MS);
}

// --- main render -------------------------------------------------------------
function render() {
  if (!status) {
    app.replaceChildren(el("p", { class: "err" }, `Couldn't load: ${lastError || "unknown error"}`));
    return;
  }
  const last = status.last;
  const dev = last?.device;
  const settings = status.settings;

  const header = el("header", {},
    el("h1", {}, "Heat pump"),
    el("span", { class: "muted" }, last ? `Updated ${fmtTime(new Date(last.at))}` : "No reading yet"),
    lastError ? el("span", { class: "err" }, `Refresh failed: ${lastError}`) : null,
    el("span", { class: "spacer" }),
    rangePicker(),
    awayButton());

  const tiles = el("div", { class: "tiles" },
    indoorTile(dev, last?.indoor),
    tile("Outdoor", deg(last?.outdoorF), last?.forecastF != null ? `Rest of tonight ~${deg(last.forecastF)}` : "No forecast"),
    unitTile(dev),
    breakerTile(status.breaker),
    status.waterHeater?.enabled ? waterHeaterTile(status.waterHeater) : null);

  app.replaceChildren(...[header, tiles, planCard(), tempCard(), energyCard(),
    history?.waterHeaterEnergy ? energyCard("Water heater energy per hour (kWh)", history.waterHeaterEnergy, { ratesNote: false }) : null,
    runsCard()].filter(Boolean));
}

// The room sensor when it's in use (to a tenth), with the unit's own reading beside it.
function indoorTile(dev, indoor) {
  const setpoint = dev ? `Setpoint ${deg(dev.targetF)}` : "";
  if (!indoor?.room) return tile("Indoor", deg(dev?.indoorF), setpoint);
  if (indoor.source === "room") {
    return tile(indoor.room.name, dev && Number.isFinite(dev.indoorF) ? `${dev.indoorF.toFixed(1)}°` : "–", `Unit's sensor ${deg(indoor.unitIndoorF)} · ${setpoint}`);
  }
  return tile("Indoor (unit's sensor)", deg(dev?.indoorF), `${indoor.room.name} sensor unavailable: ${indoor.room.error || "no reading"}`);
}

function tile(label, value, sub, extra) {
  return el("div", { class: "tile" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value), extra || null, el("div", { class: "sub" }, sub));
}

function statusPill(color, text) {
  return el("span", { class: "status" }, el("span", { class: "dot", style: `background:${color}` }), text);
}

function unitTile(dev) {
  if (status.away) {
    const heating = status.awayHeating ? (status.awayRun === "return" ? "Warming up for your return" : "Heating") : "Off";
    return tile("Unit", "Away",
      status.returnAt ? `Back ${fmtWhen(new Date(status.returnAt))}` : `Never below ${status.settings.awayMinF}° · since ${fmtWhen(new Date(status.awaySince))}`,
      statusPill(status.awayHeating ? "var(--series-2)" : "var(--text-3)", heating));
  }
  if (!dev) return tile("Unit", "–", "");
  const on = dev.power;
  const mode = dev.mode ? dev.mode[0] + dev.mode.slice(1).toLowerCase() : "";
  return tile("Unit", on ? mode : "Off", on ? `to ${deg(dev.targetF)}` : `${mode} mode, ${deg(dev.targetF)} when on`,
    on ? statusPill("var(--good)", "Running") : null);
}

// What the heater last reported, and what it's being brought to if that differs.
function waterHeaterTile(wh) {
  const r = wh.reported?.state;
  const pretty = (m) => (m ? m.toLowerCase().replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()) : "");
  const value = !r ? "–" : r.enabled ? `${r.setpointF}°` : "Off";
  const want = wh.desired;
  const matches = r && want && (want.enabled ? r.enabled && r.mode === want.mode && r.setpointF === want.setpointF : r.enabled === false);
  let sub;
  if (want && !matches) sub = `Sending ${want.enabled ? `${want.setpointF}° ${pretty(want.mode).toLowerCase()}` : "off"}${wh.attempts ? `, attempt ${wh.attempts}` : ""}`;
  else if (wh.schedule) sub = new Date(wh.schedule.onAt) > new Date()
    ? `On ${fmtWhen(new Date(wh.schedule.onAt))} at ${wh.settings.boostF}°`
    : `${wh.settings.normalF}° from ${fmtWhen(new Date(wh.schedule.dropAt))}`;
  else sub = r?.enabled ? pretty(r.mode) : r ? "Off while away" : "Not read yet";
  const pill = !r ? null : !r.connected ? statusPill("var(--critical)", "Offline")
    : wh.note ? statusPill("var(--warn)", "Retrying") : statusPill(r.enabled ? "var(--good)" : "var(--text-3)", r.enabled ? "On" : "Off");
  const now = Date.now();
  const lastHour = (history?.waterHeaterEnergy || []).map((x) => ({ ...x, t: hourStart(x) })).filter((x) => x.t + 3600000 <= now).pop();
  const breaker = lastHour ? el("div", { class: "sub" }, `Breaker ${lastHour.kWh.toFixed(2)} kWh, ${fmtTime(new Date(lastHour.t))}–${fmtTime(new Date(lastHour.t + 3600000))}`) : null;
  return tile("Water heater", value, wh.note ? `${sub} · ${wh.note}` : sub, el("div", {}, pill, breaker));
}

// Leads with the last complete hour from Leviton's energy history: that's
// measured. The panel's "live" watts can be an hour old and disagree with it
// outright, so it's only a footnote.
function breakerTile(b) {
  if (history?.levitonEnabled === false) return tile("Heat pump, last hour", "–", "Leviton not configured");
  const now = Date.now();
  const done = (history?.energy || []).map((r) => ({ ...r, t: hourStart(r) })).filter((r) => r.t + 3600000 <= now);
  const lastHour = done[done.length - 1];
  const at = b?.lastUpdated ? new Date(b.lastUpdated) : null;
  const ageMin = at ? Math.round((now - at) / 60000) : null;
  const live = b?.watts == null ? null : `Panel live reading ${(b.watts / 1000).toFixed(1)} kW${ageMin != null ? `, ${ageMin} min old` : ""}`;
  if (!lastHour) return tile("Heat pump, last hour", "–", live || "No energy data yet");
  return tile("Heat pump, last hour", `${lastHour.kWh.toFixed(2)} kW`,
    live || "",
    el("div", { class: "sub" }, `avg ${fmtTime(new Date(lastHour.t))}–${fmtTime(new Date(lastHour.t + 3600000))}`));
}

function planCard() {
  const last = status.last;
  const plan = last?.plan;
  const s = status.settings;
  let headline, detail = [];
  if (status.away) {
    const p = plan || {};
    const back = status.returnAt ? new Date(status.returnAt) : null;
    // Worked out from the house as it is now: only meaningful once no bank comes first.
    const warmFrom = p.returnStartAt && (p.bankF == null || !p.startAt || new Date(p.returnStartAt) < new Date(p.startAt)) ? new Date(p.returnStartAt) : null;
    if (back && status.awayRun === "return") {
      headline = `Warming up to ${s.targetF}° for your return ${fmtWhen(back)}`;
    } else if (back && p.bankF == null) {
      headline = `Back ${fmtWhen(back)}: ${s.targetF}° by then${warmFrom ? `, warming from ~${fmtWhen(warmFrom)}` : ""}`;
    } else {
      headline = p.bankF != null
        ? `Away: bank to ${p.bankF}° by ${s.windowEnd}${p.startAt ? ` (from ~${fmtTime(new Date(p.startAt))})` : ""}, then coast${back && p.returnF != null ? " until you're back" : " through peak"}`
        : "Away";
    }
    if (back && (p.bankF == null || status.awayRun === "return")) {
      detail.push(`Away mode ends then and the heat stays on at ${s.targetF}°.`); // the headline says the rest
    } else if (back) {
      let r = `Back ${fmtWhen(back)}: ${s.targetF}° by then`;
      if (warmFrom) r += `, warm-up from ~${fmtWhen(warmFrom)}`;
      if (p.returnF != null) {
        r += `. That takes ${p.returnF.toFixed(1)}° at ${s.windowEnd}`;
        if (p.bankF >= Math.ceil(p.returnF)) r += ", which tonight's bank covers";
        else if (Math.ceil(p.worthF) > p.bankF) r += `, capped at ${p.bankF}° -- a short warm-up before you arrive covers the rest`;
        else r += ` -- at today's prices it isn't worth banking that far ahead, so the rest is heated before you arrive`;
      } else if (!warmFrom && p.bankF != null) {
        r += "; the warm-up time is worked out after the bank";
      }
      detail.push(`${r}. Away mode ends then and the heat stays on at ${s.targetF}°.`);
    }
    if (p.requiredF != null && p.returnF == null && p.bankF != null) {
      let why = `Coasting the whole peak needs ${p.requiredF.toFixed(1)}° at ${s.windowEnd}`;
      if (p.worthF != null && p.worthF < p.requiredF) {
        why += `; at today's prices heat is only worth banking for the first ${p.horizonHours.toFixed(1)} h of it (${p.worthF.toFixed(1)}°)`;
      }
      if (Math.ceil(p.worthF ?? p.requiredF) > p.bankF) why += `, capped at ${p.bankF}°`;
      why += p.bankF < Math.ceil(p.requiredF) ? " -- the floor guard covers the rest of the peak." : ".";
      detail.push(why);
    }
    const wh = status.waterHeater;
    if (wh?.enabled) {
      detail.push(wh.schedule
        ? `Water heater off until ${fmtWhen(new Date(wh.schedule.onAt))}, then ${wh.settings.boostF}° until ${fmtWhen(new Date(wh.schedule.dropAt))}, then ${wh.settings.normalF}°.`
        : `Water heater off while away${back ? "" : "; set a return time to have it back on for you"}.`);
    }
    detail.push(`Never below ${s.awayMinF}°: heats at ${s.awayMinF + 1}° any hour, until ${s.awayMinF + 3}°.`);
    if (last?.coolingModel) detail.push(`Heat loss: ${last.coolingModel}.`);
    detail.push(`The ${s.targetF}° preheat is paused while away.`);
  } else if (!status.preheatEnabled) {
    headline = "Overnight preheat is turned off";
  } else if (plan?.startAt) {
    const start = new Date(plan.startAt);
    headline = `Preheat to ${s.targetF}° expected at ${fmtTime(start)}, done by ${s.windowEnd}`;
    detail.push(`Needs ~${Math.round(plan.minutesNeeded)} min at ${last.ratePerHour.toFixed(2)}°F/h.`);
  } else if (plan) {
    headline = plan.reason[0].toUpperCase() + plan.reason.slice(1);
  } else {
    headline = "Waiting for the first reading";
  }
  if (status.lastPreheat) detail.push(`Last preheat handled for the morning of ${status.lastPreheat}.`);
  if (!status.away && s.heatOffTime) detail.push(`Heat switches off at ${s.heatOffTime} when peak power starts.`);
  if (last?.model) detail.push(`Warm-up model: ${last.model}.`);
  detail.push(`Off-peak ${s.windowStart}–${s.windowEnd}. ${status.samples} samples logged.`);
  return el("div", { class: "card" }, el("h2", {}, "Tonight"), el("div", { class: "plan" }, headline),
    el("p", { class: "muted", style: "margin:6px 0 0" }, detail.join(" ")),
    status.away ? returnControl() : null);
}

// "YYYY-MM-DDTHH:MM" in local time, what a datetime-local input takes.
const localInput = (d) => {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

// When you'll be back: the house is at the preheat target by then, and away mode ends.
function returnControl() {
  const saved = status.returnAt ? localInput(new Date(status.returnAt)) : "";
  const input = el("input", {
    type: "datetime-local", id: "return-at", "aria-label": "Back home at",
    min: localInput(new Date()),
    oninput: (e) => { returnDraft = e.target.value; },
    onblur: () => { if (renderPending) { renderPending = false; setTimeout(render, 0); } },
  });
  input.value = returnDraft ?? saved;
  const send = async (btn, returnAt) => {
    btn.disabled = true;
    try {
      await api("/thermostat/return", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnAt }) });
      returnDraft = null;
    } catch (err) { alert(`Failed: ${err.message}`); btn.disabled = false; return; }
    setTimeout(load, 1500);
  };
  const save = el("button", { class: "primary", onclick: (e) => {
      if (!input.value) return alert("Pick a date and time first.");
      const at = new Date(input.value); // the input is local time
      if (!(at > new Date())) return alert("That's in the past.");
      send(e.target, at.toISOString());
    } }, status.returnAt ? "Update" : "Set return");
  const clear = status.returnAt ? el("button", { onclick: (e) => { returnDraft = null; send(e.target, null); } }, "Clear") : null;
  return el("div", { class: "return" },
    el("div", { class: "row" }, el("label", { for: "return-at" }, "Back home"), input, save, clear),
    el("p", { class: "muted", style: "margin:6px 0 0" },
      status.returnAt
        ? `The house will be ${status.settings.targetF}° when you get back, heated on off-peak power where it can be.`
        : `Set when you'll be back and the house will be ${status.settings.targetF}° by then.`));
}

function rangePicker() {
  const sel = el("select", { "aria-label": "Time range", onchange: (e) => {
      rangeHours = parseInt(e.target.value, 10);
      store.set(RANGE_KEY, String(rangeHours));
      load();
    } });
  for (const [h, label] of [[24, "Last 24 hours"], [48, "Last 2 days"], [168, "Last 7 days"], [336, "Last 14 days"]]) {
    const o = el("option", { value: String(h) }, label);
    if (h === rangeHours) o.selected = true;
    sel.append(o);
  }
  return sel;
}

function awayButton() {
  const away = status.away;
  return el("button", { class: away ? "primary" : "", onclick: async (e) => {
      const msg = away
        ? "Turn away mode off? The unit goes back to how it was when you left."
        : `Turn away mode on? Heat is banked on off-peak power and the house never drops below ${status.settings.awayMinF}°.`;
      if (!confirm(msg)) return;
      e.target.disabled = true;
      try { await api(away ? "/thermostat/home" : "/thermostat/away", { method: "POST" }); }
      catch (err) { alert(`Failed: ${err.message}`); }
      setTimeout(load, 1500);
    } }, away ? "I'm home" : "Away mode");
}

// --- shared chart geometry ---------------------------------------------------
const M = { top: 10, right: 12, bottom: 26, left: 40 };

function chartFrame(height) {
  const box = el("div", { class: "chart" });
  const tip = el("div", { class: "tip" });
  box.append(tip);
  const width = Math.max(300, app.clientWidth - 34);
  const svg = s("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img" });
  box.prepend(svg);
  return { box, tip, svg, width, height, iw: width - M.left - M.right, ih: height - M.top - M.bottom };
}

function rangeBounds() {
  return { from: +new Date(history.from), to: +new Date(history.to) };
}

/** Off-peak windows overlapping [from, to], as [start, end] ms pairs. */
function offPeakSpans(from, to) {
  const [sh, sm] = status.settings.windowStart.split(":").map(Number);
  const [eh, em] = status.settings.windowEnd.split(":").map(Number);
  const spans = [];
  const d0 = new Date(from); d0.setDate(d0.getDate() - 1);
  for (let d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()); +d <= to; d.setDate(d.getDate() + 1)) {
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), sh, sm);
    let end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), eh, em);
    if (end <= start) end = new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1, eh, em);
    if (+end > from && +start < to) spans.push([Math.max(+start, from), Math.min(+end, to)]);
  }
  return spans;
}

function timeAxis(g, x, from, to, ih) {
  // Pick the tick step from the pixels available, so labels never collide on a phone.
  const hours = (to - from) / 3600000;
  const pxPerHour = x(to) / hours;
  const stepH = [3, 6, 12, 24, 48, 96].find((h) => h * pxPerHour >= 80) || 168;
  const first = new Date(from); first.setMinutes(0, 0, 0);
  while (first.getHours() % Math.min(stepH, 24) !== 0) first.setHours(first.getHours() + 1);
  for (let t = +first; t <= to; t += stepH * 3600000) {
    const d = new Date(t);
    const label = stepH >= 24 || d.getHours() === 0 ? fmtDay(d) : d.toLocaleTimeString([], { hour: "numeric" });
    const tx = x(t);
    g.append(s("line", { x1: tx, x2: tx, y1: ih, y2: ih + 4, stroke: "var(--border)" }));
    const txt = s("text", { x: tx, y: ih + 18, "text-anchor": "middle", "font-size": 11, fill: "var(--text-3)" });
    txt.textContent = label;
    g.append(txt);
  }
}

function setTip(tip, ...rows) { tip.replaceChildren(...rows.filter(Boolean)); }

function placeTip(tip, box, px, py) {
  tip.style.display = "block";
  const bw = box.clientWidth, tw = tip.offsetWidth;
  tip.style.left = `${Math.min(Math.max(0, px + 14), bw - tw)}px`;
  tip.style.top = `${Math.max(0, py - 10)}px`;
}

// --- temperature chart ---------------------------------------------------------
function tempCard() {
  const card = el("div", { class: "card" }, el("h2", {}, "Temperatures (°F)"));
  const samples = history?.samples || [];
  card.append(el("div", { class: "legend" },
    el("span", {}, el("span", { class: "key-line", style: "border-color:var(--series-1)" }), "Indoor"),
    el("span", {}, el("span", { class: "key-line", style: "border-color:var(--series-2)" }), "Outdoor"),
    samples.some((d) => d.indoorSource === "room") ? el("span", {}, el("span", { class: "key-line key-dash", style: "border-color:var(--series-1);opacity:.5" }), "Unit's own sensor") : null,
    el("span", {}, el("span", { class: "key-line key-dash", style: "border-color:var(--setpoint)" }), "Setpoint (when on)"),
    el("span", {}, el("span", { class: "key-box", style: "background:var(--heat-band)" }), "Heating"),
    el("span", {}, el("span", { class: "key-box", style: "background:var(--offpeak-band)" }), "Off-peak")));
  if (!samples.length) {
    card.append(el("p", { class: "muted" }, "No readings yet. The service logs one every 5 minutes."));
    return card;
  }

  const { from, to } = rangeBounds();
  const f = chartFrame(260);
  const vals = samples.flatMap((d) => [d.suspect ? null : d.indoorF, d.indoorSource === "room" ? d.unitIndoorF : null, d.outdoorF, d.power && d.mode === "HEAT" ? d.targetF : null]).filter(Number.isFinite);
  let lo = Math.floor((Math.min(...vals) - 2) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 2) / 5) * 5;
  if (hi - lo < 10) hi = lo + 10;
  const x = (t) => ((t - from) / (to - from)) * f.iw;
  const y = (v) => f.ih - ((v - lo) / (hi - lo)) * f.ih;
  const g = s("g", { transform: `translate(${M.left},${M.top})` });
  f.svg.append(g);

  for (const [a, b] of offPeakSpans(from, to)) g.append(s("rect", { x: x(a), y: 0, width: x(b) - x(a), height: f.ih, fill: "var(--offpeak-band)" }));
  // Heating bands: consecutive samples with the unit on in HEAT.
  let bandStart = null;
  samples.forEach((d, i) => {
    const heating = d.power && d.mode === "HEAT";
    const next = samples[i + 1];
    if (heating && bandStart == null) bandStart = d.t;
    if (bandStart != null && (!next || !(next.power && next.mode === "HEAT") || next.t - d.t > 20 * 60000)) {
      const end = next && next.t - d.t <= 20 * 60000 ? next.t : d.t + 5 * 60000;
      g.append(s("rect", { x: x(bandStart), y: 0, width: Math.max(1, x(end) - x(bandStart)), height: f.ih, fill: "var(--heat-band)" }));
      bandStart = null;
    }
  });

  const step = (hi - lo) / 5 >= 5 ? 10 : 5;
  for (let v = lo; v <= hi; v += step) {
    g.append(s("line", { x1: 0, x2: f.iw, y1: y(v), y2: y(v), stroke: "var(--grid)" }));
    const t = s("text", { x: -8, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-3)" });
    t.textContent = `${v}°`;
    g.append(t);
  }
  timeAxis(g, x, from, to, f.ih);

  const line = (key, color, dash, only, opacity) => {
    let dpath = "", prev = null;
    for (const d of samples) {
      const v = only && !only(d) ? null : d[key];
      if (!Number.isFinite(v)) { prev = null; continue; }
      const gap = prev && d.t - prev.t > 20 * 60000;
      dpath += `${!prev || gap ? "M" : "L"}${x(d.t).toFixed(1)},${y(v).toFixed(1)}`;
      prev = d;
    }
    g.append(s("path", { d: dpath, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": "5 4" } : {}), ...(opacity ? { opacity } : {}) }));
  };
  line("targetF", "var(--setpoint)", true, (d) => d.power && d.mode === "HEAT");
  line("outdoorF", "var(--series-2)");
  // While a room sensor is in use, the unit's own reading for comparison.
  line("unitIndoorF", "var(--series-1)", true, (d) => d.indoorSource === "room", 0.5);
  line("indoorF", "var(--series-1)", false, (d) => !d.suspect); // defrost blips left out

  // Crosshair + one tooltip listing every series at the nearest sample.
  const hair = s("line", { y1: 0, y2: f.ih, stroke: "var(--text-3)", "stroke-width": 1, visibility: "hidden" });
  const dotIn = s("circle", { r: 4, fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  const dotOut = s("circle", { r: 4, fill: "var(--series-2)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  g.append(hair, dotOut, dotIn);
  const hit = s("rect", { x: 0, y: 0, width: f.iw, height: f.ih, fill: "transparent" });
  g.append(hit);
  const show = (evt) => {
    const r = f.svg.getBoundingClientRect();
    const px = ((evt.clientX - r.left) / r.width) * f.width - M.left;
    const t = from + (px / f.iw) * (to - from);
    let best = samples[0];
    for (const d of samples) if (Math.abs(d.t - t) < Math.abs(best.t - t)) best = d;
    const bx = x(best.t);
    hair.setAttribute("x1", bx); hair.setAttribute("x2", bx); hair.setAttribute("visibility", "visible");
    for (const [dot, key] of [[dotIn, "indoorF"], [dotOut, "outdoorF"]]) {
      if (Number.isFinite(best[key]) && !(key === "indoorF" && best.suspect)) { dot.setAttribute("cx", bx); dot.setAttribute("cy", y(best[key])); dot.setAttribute("visibility", "visible"); }
      else dot.setAttribute("visibility", "hidden");
    }
    const row = (color, value, label, dash) => el("div", { class: "r" },
      el("span", { class: `key-line${dash ? " key-dash" : ""}`, style: `border-color:${color}` }), el("strong", {}, value), el("span", { class: "muted" }, label));
    setTip(f.tip,
      el("div", { class: "t" }, fmtWhen(new Date(best.t))),
      row("var(--series-1)", best.indoorSource === "room" ? `${best.indoorF.toFixed(1)}°` : deg(best.indoorF),
        best.suspect ? "Indoor (ignored -- defrost blip)" : best.indoorSource === "room" ? "Room sensor" : "Indoor"),
      best.indoorSource === "room" ? row("var(--series-1)", deg(best.unitIndoorF), "Unit's own sensor", true) : null,
      row("var(--series-2)", deg(best.outdoorF), "Outdoor"),
      row("var(--setpoint)", best.power ? `${best.mode?.toLowerCase()} ${deg(best.targetF)}` : "off", "Unit", true),
      best.away ? el("div", { class: "muted" }, "Away mode") : null);
    placeTip(f.tip, f.box, ((bx + M.left) / f.width) * r.width, ((evt.clientY - r.top)));
  };
  const hide = () => { f.tip.style.display = "none"; for (const n of [hair, dotIn, dotOut]) n.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
  card.append(f.box);

  // Table view.
  const rows = samples.slice().reverse().map((d) => el("tr", {},
    el("td", {}, fmtWhen(new Date(d.t))), el("td", {}, d.suspect ? `${deg(d.indoorF)} (ignored)` : deg(d.indoorF)), el("td", {}, deg(d.outdoorF)),
    el("td", {}, d.power ? `${d.mode} ${deg(d.targetF)}` : "Off"), el("td", {}, d.away ? "Yes" : "")));
  card.append(el("details", {}, el("summary", {}, "Show readings as a table"),
    el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, ...["Time", "Indoor", "Outdoor", "Unit", "Away"].map((h) => el("th", {}, h)))), el("tbody", {}, rows)))));
  return card;
}

// --- energy chart ----------------------------------------------------------------
function hourStart(row) {
  const [d, hm] = row.hour.split(" ");
  const [Y, Mo, D] = d.split("-").map(Number);
  return +new Date(Y, Mo - 1, D, Number(hm.slice(0, 2)));
}

// National Grid's price for the hour when the Pi has it; Leviton's estimate otherwise.
const costOf = (r) => (r.ngCost != null ? r.ngCost : r.cost);
const costSource = () => (history?.rates?.totals ? "National Grid" : "Leviton est.");
const cents = (v) => `${(v * 100).toFixed(1)}¢`;

function inOffPeak(t) {
  return offPeakSpans(t - 86400000, t + 86400000).some(([a, b]) => t >= a && t < b);
}

// Hourly kWh from a Leviton breaker, off-peak vs peak, priced. The heat pump's
// by default; the water heater's card passes its own rows and skips the rates note.
function energyCard(title = "Heat pump energy per hour (kWh)", source = history?.energy, { ratesNote = true } = {}) {
  const card = el("div", { class: "card" }, el("h2", {}, title));
  if (history?.levitonEnabled === false) {
    card.append(el("p", { class: "muted" }, "Leviton isn't configured (LEVITON_EMAIL / LEVITON_PASSWORD on the Pi)."));
    return card;
  }
  const { from, to } = rangeBounds();
  const now = Date.now();
  const rows = (source || []).map((r) => ({ ...r, t: hourStart(r) })).filter((r) => r.t + 3600000 > from && r.t <= now);
  if (!rows.length) {
    card.append(el("p", { class: "muted" }, "No energy data from the Leviton panel yet."));
    return card;
  }
  card.append(el("div", { class: "legend" },
    el("span", {}, el("span", { class: "key-box", style: "background:var(--bar)" }), "Off-peak hour"),
    el("span", {}, el("span", { class: "key-box", style: "background:var(--bar-peak)" }), "Peak hour")));

  const f = chartFrame(180);
  const max = Math.max(0.2, ...rows.map((r) => r.kWh));
  const tick = [0.05, 0.1, 0.25, 0.5, 1, 2, 2.5, 5, 10].find((t) => t * 4 >= max) || Math.ceil(max / 4);
  const top = tick * 4;
  const x = (t) => ((t - from) / (to - from)) * f.iw;
  const y = (v) => f.ih - (v / top) * f.ih;
  const g = s("g", { transform: `translate(${M.left},${M.top})` });
  f.svg.append(g);
  for (const [a, b] of offPeakSpans(from, to)) g.append(s("rect", { x: x(a), y: 0, width: x(b) - x(a), height: f.ih, fill: "var(--offpeak-band)" }));
  for (let i = 0; i <= 4; i++) {
    const v = (top / 4) * i;
    g.append(s("line", { x1: 0, x2: f.iw, y1: y(v), y2: y(v), stroke: "var(--grid)" }));
    const t = s("text", { x: -8, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-3)" });
    t.textContent = String(+v.toFixed(2));
    g.append(t);
  }
  timeAxis(g, x, from, to, f.ih);

  const slot = (3600000 / (to - from)) * f.iw;
  const bw = Math.max(1, slot - 2); // 2px surface gap between adjacent bars
  for (const r of rows) {
    if (r.kWh <= 0) continue;
    const bx = Math.max(0, x(r.t) + 1), h = f.ih - y(r.kWh);
    const off = inOffPeak(r.t);
    const rx = Math.min(4, bw / 2, h);
    // Rounded top, square base on the baseline.
    const path = `M${bx},${f.ih}V${f.ih - h + rx}Q${bx},${f.ih - h} ${bx + rx},${f.ih - h}H${bx + bw - rx}Q${bx + bw},${f.ih - h} ${bx + bw},${f.ih - h + rx}V${f.ih}Z`;
    const bar = s("path", { d: path, fill: off ? "var(--bar)" : "var(--bar-peak)", tabindex: 0 });
    const hitR = s("rect", { x: x(r.t), y: 0, width: Math.max(slot, 6), height: f.ih, fill: "transparent" });
    const show = (evt) => {
      bar.setAttribute("opacity", "0.8");
      const end = new Date(r.t + 3600000);
      setTip(f.tip,
        el("div", { class: "t" }, `${fmtDay(new Date(r.t))} ${fmtTime(new Date(r.t))}–${fmtTime(end)}`),
        el("div", { class: "r" }, el("strong", {}, `${r.kWh.toFixed(2)} kWh`), el("span", { class: "muted" }, off ? "off-peak" : "peak")),
        r.ngCost != null
          ? el("div", { class: "muted" }, `$${r.ngCost.toFixed(2)} at ${cents(r.pricePerKWh)}/kWh${r.period === "superPeak" ? " (super-peak)" : ""}`)
          : r.cost != null ? el("div", { class: "muted" }, `Leviton est. $${r.cost.toFixed(2)}`) : null);
      const rect = f.svg.getBoundingClientRect();
      placeTip(f.tip, f.box, ((x(r.t) + M.left) / f.width) * rect.width, evt.clientY ? evt.clientY - rect.top : 20);
    };
    const hide = () => { bar.removeAttribute("opacity"); f.tip.style.display = "none"; };
    for (const n of [hitR, bar]) { n.addEventListener("pointermove", show); n.addEventListener("pointerdown", show); n.addEventListener("pointerleave", hide); }
    bar.addEventListener("focus", show); bar.addEventListener("blur", hide);
    g.append(bar, hitR);
  }
  card.append(f.box);

  // Totals: the most recent off-peak window, and peak hours since it ended.
  const spans = offPeakSpans(now - 2 * 86400000, now);
  const lastSpan = spans.filter(([a]) => a <= now).pop();
  const sum = (pred) => rows.filter(pred).reduce((a, r) => a + r.kWh, 0);
  const sumCost = (pred) => rows.filter(pred).reduce((a, r) => a + (costOf(r) || 0), 0);
  const saved = (pred) => rows.filter(pred).reduce((a, r) => a + (r.ngCostAtOnPeak != null ? r.ngCostAtOnPeak - r.ngCost : 0), 0);
  const totals = el("div", { class: "totals" });
  if (lastSpan) {
    const [a, b] = lastSpan;
    const inSpan = (r) => r.t >= a && r.t < b;
    const after = (r) => r.t >= b && !inOffPeak(r.t);
    totals.append(
      el("div", {}, el("strong", {}, `${sum(inSpan).toFixed(1)} kWh`), b > now ? "Off-peak so far tonight" : "Last off-peak window", el("span", { class: "muted" }, ` · $${sumCost(inSpan).toFixed(2)}`)),
      history?.rates?.totals ? el("div", {}, el("strong", {}, `$${saved(inSpan).toFixed(2)}`), b > now ? "Saved so far tonight" : "Saved that night", el("span", { class: "muted" }, " vs the same kWh on-peak")) : null,
      b <= now ? el("div", {}, el("strong", {}, `${sum(after).toFixed(1)} kWh`), "Peak hours since", el("span", { class: "muted" }, ` · $${sumCost(after).toFixed(2)}`)) : null);
  }
  totals.append(el("div", {}, el("strong", {}, `${sum(() => true).toFixed(1)} kWh`), "Shown range", el("span", { class: "muted" }, ` · $${sumCost(() => true).toFixed(2)}`)));
  card.append(totals);
  const rt = history?.rates;
  if (!ratesNote) {
    // the heat pump card already explains the prices
  } else if (rt?.totals) {
    const day = rt.supplyDay ? new Date(`${rt.supplyDay}T12:00`) : null;
    card.append(el("p", { class: "muted", style: "margin:10px 0 0" },
      `National Grid ${rt.serviceClass}: off-peak ${cents(rt.totals.offPeak)}, on-peak ${cents(rt.totals.onPeak)}` +
      `${rt.totals.superPeak ? `, super-peak ${cents(rt.totals.superPeak)}` : ""} per kWh (supply + delivery; supply for ${day ? fmtDay(day) : "?"}).` +
      " Excludes the small riders on the rate statements and fixed monthly charges."));
  } else if (rt?.enabled) {
    card.append(el("p", { class: "muted", style: "margin:10px 0 0" }, "National Grid prices not fetched yet; costs shown are Leviton's estimate."));
  }

  const trs = rows.slice().reverse().map((r) => el("tr", {}, el("td", {}, `${fmtDay(new Date(r.t))} ${fmtTime(new Date(r.t))}`),
    el("td", {}, r.kWh.toFixed(2)), el("td", {}, inOffPeak(r.t) ? "Off-peak" : r.period === "superPeak" ? "Super-peak" : "Peak"),
    el("td", {}, r.pricePerKWh != null ? cents(r.pricePerKWh) : ""), el("td", {}, costOf(r) != null ? `$${costOf(r).toFixed(2)}` : "")));
  card.append(el("details", {}, el("summary", {}, "Show hourly energy as a table"),
    el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, ...["Hour", "kWh", "Period", "Price/kWh", `Cost (${costSource()})`].map((h) => el("th", {}, h)))), el("tbody", {}, trs)))));
  return card;
}

// --- learned runs ------------------------------------------------------------------
function runsCard() {
  const card = el("div", { class: "card" }, el("h2", {}, "Learned warm-ups"));
  const runs = status.learnedRuns || [];
  card.append(el("p", { class: "muted", style: "margin-top:0" },
    runs.length
      ? "Each heating run of 30+ minutes that needed 2°F+ is measured. The preheat start is worked out from these and tonight's forecast."
      : "None yet. Every heating run of 30+ minutes that needs 2°F+, including ones you start by hand, gets measured here. Until then the preheat uses a deliberately slow guess, and starts no later than " + status.settings.latestStart + "."));
  if (!runs.length) return card;
  const trs = runs.slice().reverse().map((r) => el("tr", {},
    el("td", {}, fmtWhen(new Date(r.start))),
    el("td", {}, `${Math.round((r.end - r.start) / 60000)} min`),
    el("td", {}, `${deg(r.startF)} → ${deg(r.endF)}`),
    el("td", {}, deg(r.outdoorF)),
    el("td", {}, `${r.ratePerHour.toFixed(2)}°F/h`)));
  card.append(el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, ...["Started", "Length", "Indoor", "Outdoor", "Rate"].map((h) => el("th", {}, h)))), el("tbody", {}, trs))));
  return card;
}

// Redraw charts at the new width.
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => status && render(), 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

app.replaceChildren(el("p", { class: "muted" }, "Loading…"));
load().then(schedule);
</script>
